# pnpm reads only auth and registry settings from `.npmrc`; everything else
# belongs here. `minimum-release-age` happened to work from there in 10.34.4
# and `minimum-release-age-exclude` did not, which left the delay on with its
# exemption silently off.
#
# 4320 minutes (3 days) matches nulab/backlog-mcp-server and the
# `min-release-age=3` that nulab/backlog-js sets for npm. It is also what
# "latest" means for every tool this repository depends on: the newest release
# that is at least three days old, not the newest release.
minimumReleaseAge: 4320

# Replaces `onlyBuiltDependencies`, which pnpm 11 removed along with
# `neverBuiltDependencies` and `ignoredBuiltDependencies`. Nothing builds by
# default, and an install script from a package that is not listed here fails
# the install rather than being skipped quietly.
allowBuilds: {}

# Vite+ provisions Node.js (from `devEngines.runtime`) and pnpm (from
# `packageManager`) itself. Left on `download`, pnpm would fetch and link the
# same Node a second time, and could switch to a different pnpm than the one
# `vp` launched.
runtimeOnFail: ignore
pmOnFail: ignore

# No `packages`: the root package is a member implicitly and nothing else is.
# `examples/*` are deliberately not members — each one is a standalone project
# that installs the published adapter from npm and deploys from its own
# directory, so pulling them in here would put a dependency on an unpublished
# version into this repository's own install.
