pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: '*.{js,ts,jsx,tsx}'
      run: pnpm exec oxlint --fix {staged_files} || true
      stage_fixed: true
    oxfmt:
      glob: '*.{js,ts,jsx,tsx,json,css,html,yaml,yml}'
      exclude: 'pnpm-lock.yaml'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
