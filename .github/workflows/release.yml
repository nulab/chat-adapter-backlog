name: Release
run-name: "Release: ${{ inputs.newversion }}${{ inputs.dry-run && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      newversion:
        type: choice
        options:
          - patch
          - minor
          - major
        description: New version
        default: patch
        required: true
      dry-run:
        type: boolean
        description: Dry run — build and pack only; publish, tag and release nothing
        default: true
      allow-released-commit:
        type: boolean
        description: Converge on a version tag on HEAD that another run created — recovery for a run too old to re-run, only while main still points at the tagged commit
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      skip-examples: true

  # Everything that runs this repository's code — the install, its lifecycle
  # scripts, the build — happens here, without `id-token: write` or
  # `contents: write`. The publish job below only moves the tarball this job
  # packed.
  pack:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEW_VERSION_TYPE: ${{ inputs.newversion }}
    outputs:
      name: ${{ steps.pack.outputs.name }}
      node_version: ${{ steps.toolchain.outputs.node_version }}
      npm_version: ${{ steps.toolchain.outputs.npm_version }}
      version: ${{ steps.target.outputs.version }}
      tag: v${{ steps.target.outputs.version }}
      previous_tag: ${{ steps.target.outputs.previous_tag }}
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 0 is what brings the tags (fetch-tags alone is unreliable:
          # actions/checkout#1471, #1662); fetch-tags says the guard needs them.
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          standalone: true

      - run: pnpm install --frozen-lockfile

      # Packing and publishing need npm, and npm comes with a Node from outside
      # the project: the Node that `pnpm install` provisions is installed
      # without npm, npx or corepack. Not `node-version: 26`: setup-node
      # resolves a major to the newest release on the day — on 2026-09-23 a
      # two-day-old 26.10.0 that `minimumReleaseAge` keeps out of every other
      # install here — and `pack` and `publish` could each get a different npm.
      # The lockfile's exact Node, read back from the runtime pnpm linked,
      # makes both jobs and every re-run use the same one.
      - name: Read the Node the lockfile pins
        id: pinned
        run: |
          node_version=$(pnpm exec node --version)
          echo "node_version=${node_version#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pinned.outputs.node_version }}
          package-manager-cache: false

      - name: Record the toolchain
        id: toolchain
        env:
          PINNED_NODE: ${{ steps.pinned.outputs.node_version }}
        run: |
          if [ "$(node --version)" != "v${PINNED_NODE}" ]; then
            echo "::error::setup-node put $(node --version) on PATH, not the lockfile's v${PINNED_NODE}."
            exit 1
          fi
          {
            echo "node_version=${PINNED_NODE}"
            echo "npm_version=$(npm --version)"
          } >> "$GITHUB_OUTPUT"

      # The target is fixed before anything is written, and a tag already on
      # HEAD wins over the bump: this is what lets a re-run after a late
      # failure aim at the version the first attempt was making instead of
      # the one after it.
      #
      # `git describe` returns the nearest tag reachable from HEAD, not the
      # highest semver. Those are the same tag only because `main` is linear
      # (squash merge) and the `release` concurrency group lets one release
      # tag at a time.
      #
      # A tag on HEAD is converged on only by the run that created it, which
      # `publish` records in the annotated tag's message. Not
      # `github.run_attempt > 1`: re-running a run this guard refused is
      # attempt 2 of a run that owns nothing, and would go green doing nothing.
      - name: Fix the target version
        id: target
        env:
          ALLOW_RELEASED_COMMIT: ${{ inputs.allow-released-commit }}
        run: |
          tag_on_head=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n 1)

          if [ -n "$tag_on_head" ]; then
            previous_tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
            creator=$(git for-each-ref --format='%(contents:subject)' "refs/tags/${tag_on_head}")
            if [ "$creator" != "release.yml run ${GITHUB_RUN_ID}" ] && [ "$ALLOW_RELEASED_COMMIT" != true ]; then
              if [[ "$creator" =~ ^release\.yml\ run\ ([0-9]+)$ ]]; then
                created_by="run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${BASH_REMATCH[1]}"
              else
                created_by="something other than release.yml"
              fi
              echo "::error::${GITHUB_SHA} is already tagged ${tag_on_head}, created by ${created_by}; there is nothing new to release. To finish a partial release, re-run the run that created ${tag_on_head}; to converge on this tag from a new run, set allow-released-commit."
              exit 1
            fi
            version=${tag_on_head#v}
          else
            previous_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            if [ -z "$previous_tag" ] && [ "$NEW_VERSION_TYPE" != minor ]; then
              echo "::error::The first release is 0.1.0, a minor from the implicit v0.0.0 (DEVELOPMENT.md, Versioning); dispatch with newversion: minor."
              exit 1
            fi
            # package.json stays at 0.0.0 on main; git tags are the version of
            # record. `npm version` only bumps relative to the current value,
            # so the tag has to be written in before the bump.
            npm version "${previous_tag:-v0.0.0}" --no-git-tag-version --allow-same-version
            npm version "$NEW_VERSION_TYPE" --no-git-tag-version
            version=$(node -p "require('./package.json').version")
          fi

          npm version "$version" --no-git-tag-version --allow-same-version
          {
            echo "version=${version}"
            echo "previous_tag=${previous_tag}"
          } >> "$GITHUB_OUTPUT"

      # Before anything is built, and writing nothing. Bumping from a tag whose
      # version never reached the registry would skip that version for good,
      # and a tag for the computed version on another commit means `publish`
      # could only fail at it after the build.
      - name: Check the tags against the registry
        env:
          VERSION: ${{ steps.target.outputs.version }}
          PREVIOUS_TAG: ${{ steps.target.outputs.previous_tag }}
        run: |
          name=$(jq -r .name package.json)
          if [ -n "$PREVIOUS_TAG" ]; then
            status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2f}/${PREVIOUS_TAG#v}")
            if [ "$status" != 200 ]; then
              echo "::error::The registry answered ${status} for ${name}@${PREVIOUS_TAG#v}, so ${PREVIOUS_TAG} tags a version that was never published. Bumping from it would skip that version; decide by hand whether to delete the tag."
              exit 1
            fi
          fi
          tagged=$(git rev-parse -q --verify "refs/tags/v${VERSION}^{commit}" || true)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::v${VERSION} already tags ${tagged}, not ${GITHUB_SHA}."
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # `--ignore-scripts` because the build has already run and the only
      # lifecycle script left, `prepare`, installs lefthook's git hooks.
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/package" > "$RUNNER_TEMP/pack.json"
          jq -r '.[0].files[].path' "$RUNNER_TEMP/pack.json"
          {
            echo "name=$(jq -r '.[0].name' "$RUNNER_TEMP/pack.json")"
            echo "tarball=$(jq -r '.[0].filename' "$RUNNER_TEMP/pack.json")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          # A fixed name, overwritten by a re-run of this job, is what lets a
          # "Re-run failed jobs" attempt of `publish` find the tarball an
          # earlier attempt of `pack` uploaded.
          overwrite: true

      - name: Summary
        env:
          NAME: ${{ steps.pack.outputs.name }}
          VERSION: ${{ steps.target.outputs.version }}
          PREVIOUS_TAG: ${{ steps.target.outputs.previous_tag }}
          NODE_VERSION: ${{ steps.toolchain.outputs.node_version }}
          NPM_VERSION: ${{ steps.toolchain.outputs.npm_version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          {
            echo "| | |"
            echo "| --- | --- |"
            echo "| Package | \`${NAME}@${VERSION}\` |"
            echo "| Tag | \`v${VERSION}\` on \`${GITHUB_SHA}\` |"
            echo "| Notes from | \`${PREVIOUS_TAG:-the first commit}\` |"
            echo "| Packed with | Node \`${NODE_VERSION}\`, npm \`${NPM_VERSION}\` |"
            echo "| Dry run | ${DRY_RUN} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Each step checks whether its effect already exists and skips if it does,
  # so re-running this run after a failure at any step finishes the release
  # rather than colliding with the half of it that already happened. Nothing
  # here checks out or runs the repository's code.
  publish:
    needs: [pack]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    env:
      NAME: ${{ needs.pack.outputs.name }}
      VERSION: ${{ needs.pack.outputs.version }}
      TAG: ${{ needs.pack.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.pack.outputs.previous_tag }}
      TARBALL_NAME: ${{ needs.pack.outputs.tarball }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # The `production` environment's deployment-branch policy says the same,
      # but it lives in repository settings, where it can change without a
      # diff; this keeps the rule readable in the file that depends on it.
      - name: Refuse anything but main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are cut from main, not ${GITHUB_REF}."
            exit 1
          fi

      # npm publishes, so npm comes from here, from the same Node `pack` read
      # off the lockfile. No upgrade step: every Node 26.x bundles npm 11.12.1
      # or newer, above the 11.5.1 that trusted publishing needs, and
      # `npm install -g npm@latest` would install a new major the day it ships
      # (12.1.0 on 2026-09-22) — `.npmrc`'s `min-release-age` is a project
      # setting and is not read in global mode. The floor is asserted below
      # instead of assumed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.pack.outputs.node_version }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check npm supports trusted publishing and is the npm that packed
        env:
          PACK_NPM_VERSION: ${{ needs.pack.outputs.npm_version }}
        run: |
          npm_version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm ${npm_version} predates 11.5.1, the first release with trusted publishing."
            exit 1
          fi
          if [ "$npm_version" != "$PACK_NPM_VERSION" ]; then
            echo "::error::npm ${npm_version} would publish a tarball npm ${PACK_NPM_VERSION} packed."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      # The artifact carries a fixed name across attempts, so make sure the
      # tarball is the version this attempt's `pack` outputs describe.
      - name: Check the tarball is the version being released
        run: |
          manifest=$(tar -xzOf "${RUNNER_TEMP}/package/${TARBALL_NAME}" package/package.json)
          packed="$(jq -r .name <<< "$manifest")@$(jq -r .version <<< "$manifest")"
          if [ "$packed" != "${NAME}@${VERSION}" ]; then
            echo "::error::The package artifact holds ${packed}, not ${NAME}@${VERSION}."
            exit 1
          fi

      # A 200 only says that something was published under this version, so
      # it is compared against the provenance attestation — which commit,
      # repository and workflow published it — rather than skipped on trust.
      # Not against the tarball's digest: neither the build nor `npm pack` is
      # established to be byte-reproducible, so a digest check would fail the
      # very re-runs it exists to let through.
      #
      # NODE_AUTH_TOKEN is for the first publish only, which cannot use
      # trusted publishing because npm will not configure it for a package
      # that does not exist yet. Once NPM_TOKEN is deleted this is empty,
      # which is harmless: npm tries OIDC first and, when the exchange
      # succeeds, replaces whatever token the config holds.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          registry=https://registry.npmjs.org
          escaped_name=${NAME/\//%2f}
          status=$(curl -sS -o /dev/null -w '%{http_code}' "${registry}/${escaped_name}/${VERSION}")

          case "$status" in
            404)
              npm publish "${RUNNER_TEMP}/package/${TARBALL_NAME}" --provenance --access public
              ;;
            200)
              if ! attestations=$(curl -sSf "${registry}/-/npm/v1/attestations/${escaped_name}@${VERSION}"); then
                echo "::error::${NAME}@${VERSION} is on the registry without any attestation, so there is no way to tell which commit it was built from. Decide by hand."
                exit 1
              fi
              statement=$(jq -r '.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1") | .bundle.dsseEnvelope.payload' <<< "$attestations" | base64 -d)
              if [ -z "$statement" ]; then
                echo "::error::${NAME}@${VERSION} is on the registry without a SLSA provenance statement, so there is no way to tell which commit it was built from. Decide by hand."
                exit 1
              fi
              commit=$(jq -r '.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit' <<< "$statement")
              repository=$(jq -r '.predicate.buildDefinition.externalParameters.workflow.repository' <<< "$statement")
              workflow=$(jq -r '.predicate.buildDefinition.externalParameters.workflow.path' <<< "$statement")
              expected_workflow=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}
              expected_workflow=${expected_workflow%%@*}
              if [ "$commit" != "$GITHUB_SHA" ] || [ "$repository" != "$EXPECTED_REPOSITORY" ] || [ "$workflow" != "$expected_workflow" ]; then
                echo "::error::${NAME}@${VERSION} is already published from ${repository} ${workflow} at ${commit}, not from this run's ${GITHUB_SHA}."
                exit 1
              fi
              echo "::notice::${NAME}@${VERSION} is already published from ${GITHUB_SHA}; skipping the publish."
              ;;
            *)
              echo "::error::The registry answered ${status} for ${NAME}@${VERSION}."
              exit 1
              ;;
          esac

      - name: Tag the release commit
        run: |
          if ref=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha' 2>/dev/null); then
            read -r type sha <<< "$ref"
            if [ "$type" = tag ]; then
              sha=$(gh api "repos/${GH_REPO}/git/tags/${sha}" --jq .object.sha)
            fi
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "::error::${TAG} already points at ${sha}, not at ${GITHUB_SHA}."
              exit 1
            fi
            echo "::notice::${TAG} already points at ${GITHUB_SHA}; skipping the tag."
          else
            # Annotated, and naming this run: `pack` reads the message to tell
            # a re-run of this run, which may converge on the tag, from any
            # other run, which may not.
            tag_object=$(gh api "repos/${GH_REPO}/git/tags" \
              -f tag="$TAG" -f message="release.yml run ${GITHUB_RUN_ID}" \
              -f object="$GITHUB_SHA" -f type=commit --jq .sha)
            gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$tag_object" > /dev/null
          fi

      - name: Create GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::The GitHub release ${TAG} already exists; skipping it."
            exit 0
          fi
          flags=(--verify-tag --generate-notes)
          if [ -n "$PREVIOUS_TAG" ]; then
            flags+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "$TAG" "${flags[@]}"
