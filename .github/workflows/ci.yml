name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

  typecheck:
    runs-on: ubuntu-latest
    name: Type check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # tsdown exits 0 for output that cannot actually be loaded, so the entry
      # is executed here rather than only being produced. A wrong `exports`
      # condition or an unresolvable import in the bundle is invisible to every
      # other job.
      #
      # Through `pnpm exec`, not a bare `node`: the runner image ships its own
      # Node and would service this step with a version nothing in the
      # repository selected.
      - name: Smoke test the built entry
        run: |
          pnpm exec node -e "import('./dist/index.js').then((m) => { if (m.ADAPTER_ID !== 'backlog') { throw new Error('esm entry is broken'); } })"
          test -f dist/index.d.ts

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    name: Test (Node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # pnpm-workspace.yaml's `useNodeVersion` — the only thing that puts Node
      # on PATH here — takes an exact version and rejects `22`, `22.x` and
      # `lts`, so the matrix major has to be resolved to one. Asking pnpm keeps
      # three patch versions from being pinned in this file, where they would
      # rot silently: the matrix would still be green while testing Node the
      # supported range has moved past.
      - name: Resolve the matrix major to an exact version
        env:
          NODE_MAJOR: ${{ matrix.node-version }}
        run: |
          version="$(pnpm env list --remote "$NODE_MAJOR" | tail -1)"
          echo "Resolved Node $NODE_MAJOR to $version"
          echo "PNPM_NODE_VERSION=$version" >> "$GITHUB_ENV"

      # `--config.use-node-version` overrides the setting per invocation, which
      # is the only override pnpm 10.34.5 offers: there is no environment
      # variable for it, so every pnpm command below has to carry the flag or
      # it silently runs the repository default instead of the matrix entry.
      # Asserted inside the Node process rather than by capturing its output:
      # pnpm announces "Fetching Node.js <version> ..." on stdout when it has
      # to download the runtime, which it does in some jobs and not others, so
      # a captured stdout is the version with an unpredictable preamble.
      - name: Verify the provisioned Node
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node-version }}
        run: |
          pnpm --config.use-node-version="$PNPM_NODE_VERSION" exec node -e '
            const actual = process.versions.node;
            const { EXPECTED_NODE_MAJOR, PNPM_NODE_VERSION } = process.env;
            console.log(`node ${actual}`);
            if (actual !== PNPM_NODE_VERSION) {
              throw new Error(`ran Node ${actual}, not the resolved ${PNPM_NODE_VERSION}`);
            }
            if (actual.split(".")[0] !== EXPECTED_NODE_MAJOR) {
              throw new Error(`ran Node ${actual}, not the advertised major ${EXPECTED_NODE_MAJOR}`);
            }
          '
          pnpm --version

      - run: pnpm install --frozen-lockfile --config.use-node-version="$PNPM_NODE_VERSION"

      - name: Test
        run: pnpm --config.use-node-version="$PNPM_NODE_VERSION" run test
