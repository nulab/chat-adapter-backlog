name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

  typecheck:
    runs-on: ubuntu-latest
    name: Type check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # tsdown exits 0 for output that cannot actually be loaded, so the entry
      # is executed here rather than only being produced. A wrong `exports`
      # condition or an unresolvable import in the bundle is invisible to every
      # other job.
      #
      # Through `pnpm exec`, not a bare `node`: the runner image ships its own
      # Node and would service this step with a version nothing in the
      # repository selected.
      - name: Smoke test the built entry
        run: |
          pnpm exec node -e "import('./dist/index.js').then((m) => { if (m.ADAPTER_ID !== 'backlog') { throw new Error('esm entry is broken'); } })"
          test -f dist/index.d.ts

  test:
    runs-on: ubuntu-latest
    name: Test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      # `pnpm exec node` exits 0 even when nothing provisioned a runtime: with
      # no `node_modules/.bin/node` to shadow it, the runner image's own Node
      # services the step and the suite silently passes on a version the
      # repository never selected. The range is read out of `package.json` so
      # that bumping `devEngines.runtime` does not need this file edited too.
      #
      # Asserted inside the Node process rather than by capturing its output:
      # pnpm writes its own progress to stdout, which would make the captured
      # version a value with an unpredictable preamble.
      - name: Verify the provisioned Node satisfies devEngines.runtime
        run: |
          pnpm exec node -e '
            const { devEngines } = require("./package.json");
            const { version: provisioned } = require("./node_modules/node/package.json");
            const range = devEngines.runtime.version;
            const actual = process.versions.node;
            console.log(`node ${actual} from ${process.execPath}`);
            if (actual !== provisioned) {
              throw new Error(`ran Node ${actual}, not the ${provisioned} pnpm provisioned`);
            }
            // Comparing majors is the whole of the range check only because
            // the range is a caret: every 24.x satisfies ^24.0.0. Rather than
            // hand-roll semver for shapes that are not in use, a range in any
            // other shape is rejected here instead of waved through.
            const expected = /^\^(\d+)\./.exec(range)?.[1];
            if (!expected) {
              throw new Error(`this check only understands a caret range, not ${range}`);
            }
            if (actual.split(".")[0] !== expected) {
              throw new Error(`ran Node ${actual}, which does not satisfy devEngines.runtime ${range}`);
            }
          '
          pnpm --version

      - name: Test
        run: pnpm run test
