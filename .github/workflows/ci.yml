name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it is based on. Filtering by `branches: [main]`
  # meant a stacked pull request — the workflow CONTRIBUTING.md tells contributors
  # to use — got no checks at all until its parent merged and GitHub retargeted it,
  # which is the moment feedback stops being useful.
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs `vp` at the version `vite-plus` has in package.json, which is
      # an exact version on purpose (package.json cannot carry the comment).
      # setup-vp reads a range only through a lockfile parser that gives up on
      # pnpm 12's two-document `pnpm-lock.yaml` and falls back to `latest`, and
      # that would put a vite-plus release on the day it is published into
      # every job here, past `minimumReleaseAge`. `vp` then provisions Node
      # from `devEngines.runtime` and pnpm from `packageManager`, so neither is
      # written down anywhere else. The install is its own step, not
      # setup-vp's, to say `--frozen-lockfile`.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          run-install: false

      - run: vp install --frozen-lockfile

      - name: Check
        run: vp check

      - name: Pack
        run: vp pack

  test:
    runs-on: ubuntu-latest
    name: Test (Node ${{ matrix.node }})

    strategy:
      # One unsupported major should report itself, not hide behind the first
      # job that fails.
      fail-fast: false
      matrix:
        # The majors `engines.node` claims to support. `devEngines.runtime` is
        # the one version development happens on; this is the range the
        # published package promises, and it is only a promise if something
        # runs on all of it.
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `node-version` overrides `devEngines.runtime` for this job, and `vp`
      # provisions that Node; pnpm no longer links a second one beside it
      # (`runtimeOnFail: ignore` in pnpm-workspace.yaml). The `vp` version is
      # the one the `check` job explains.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node }}
          run-install: false

      - run: vp install --frozen-lockfile

      # The Node the tests ran on is asserted by src/test/runtime.test.ts,
      # inside the test process, from `EXPECTED_NODE_MAJOR`: `vp` launches the
      # test runner itself, and `devEngines.runtime` pins a different Node from
      # most of this matrix, so a `vp` that fell back to it would run the same
      # Node three times and still pass.
      - name: Test
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node }}
        run: vp test
