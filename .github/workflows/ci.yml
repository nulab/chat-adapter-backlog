name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

  typecheck:
    runs-on: ubuntu-latest
    name: Type check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # tsdown exits 0 for output that cannot actually be loaded, so the entry
      # is executed here rather than only being produced. A wrong `exports`
      # condition or an unresolvable import in the bundle is invisible to every
      # other job.
      - name: Smoke test the built entry
        run: |
          node -e "import('./dist/index.js').then((m) => { if (m.ADAPTER_ID !== 'backlog') { throw new Error('esm entry is broken'); } })"
          test -f dist/index.d.ts

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    name: Test (Node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node@${{ matrix.node-version }}

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test
