name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

  typecheck:
    runs-on: ubuntu-latest
    name: Type check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # tsdown exits 0 for output that cannot actually be loaded, so the entry
      # is executed here rather than only being produced. A wrong `exports`
      # condition or an unresolvable import in the bundle is invisible to every
      # other job.
      - name: Smoke test the built entry
        run: |
          node -e "import('./dist/index.js').then((m) => { if (m.ADAPTER_ID !== 'backlog') { throw new Error('esm entry is broken'); } })"
          test -f dist/index.d.ts

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    name: Test (Node ${{ matrix.node-version }})

    # `install_args: node@22` does not change which Node the job runs:
    # mise.toml's own `node = "24"` outranks an argument to `mise install`, so
    # the matrix installed the requested version and then executed 24 anyway.
    # MISE_NODE_VERSION is an override rather than an extra request.
    env:
      MISE_NODE_VERSION: ${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Each entry provisions a different toolchain, so they must not share
          # one cache entry.
          cache_key_prefix: mise-node${{ matrix.node-version }}

      # Asserted rather than echoed: a matrix that quietly tests one version
      # three times still reports three green checks, and `engines.node` is
      # only meaningfully covered while this holds.
      - name: Verify the provisioned Node
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node-version }}
        run: |
          node -v
          pnpm --version
          test "$(node -p 'process.versions.node.split(".")[0]')" = "$EXPECTED_NODE_MAJOR"

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test
